# Ontology: deploy:PreCommitComponent
# Implements: deploy:CommitValidation
# Requirement: REQ-DEP-002 Pre-commit validation
# Guidance: guidance:DeploymentPatterns#PreCommitHooks
# Description: Pre-commit hook configuration for validation

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v2.3.0
  hooks:
    - id: trailing-whitespace
      exclude: &exclude_pattern >
          (?x)^(
              .*\/(\.venv)\/.*
          )$
    - id: end-of-file-fixer
      exclude: *exclude_pattern
    - id: check-yaml
      exclude: *exclude_pattern
    - id: check-toml
      exclude: *exclude_pattern

- repo: https://github.com/psf/black
  rev: 24.2.0
  hooks:
    - id: black
      args: ["--line-length=88", "--target-version=py310"]
      exclude: *exclude_pattern

- repo: https://github.com/pycqa/isort
  rev: 5.13.2
  hooks:
    - id: isort
      args: ["--profile=black", "--line-length=88"]
      exclude: *exclude_pattern

- repo: https://github.com/pycqa/flake8
  rev: 7.0.0
  hooks:
    - id: flake8
      args: ["--max-line-length=88", "--extend-ignore=E203"]
      exclude: *exclude_pattern

- repo: local
  hooks:
    - id: guidance-compliance
      name: guidance-compliance
      entry: python tools/check_compliance.py
      language: python
      files: (^[^/]+\.(py|ttl|yml|yaml|md|sh)$|^(tools/|tests/|teams_bot/|cortex_analyst/|deployment/|docs/)\S+\.(py|ttl|yml|yaml|md|sh)$)
      exclude: ^\.venv/

default_language_version:
    python: python3

default_stages: [pre-commit]

ci:
    autofix_commit_msg: |
        [pre-commit.ci] Auto fixes from pre-commit hooks

        for more information, see https://pre-commit.ci
    autofix_prs: true
    autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
    autoupdate_schedule: weekly
    skip: []
    submodules: false
