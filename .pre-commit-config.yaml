# Ontology: deploy:PreCommitComponent
# Implements: deploy:CommitValidation
# Requirement: REQ-DEP-002 Pre-commit validation
# Guidance: guidance:ModelFirstPrinciple#modelQualityPrecedence
# Description: Pre-commit hook configuration that prioritizes ontological model quality
#   over code aesthetics. Focus is on model integrity and correctness rather than
#   strict code formatting.

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v2.3.0
  hooks:
    - id: trailing-whitespace
      exclude: &exclude_pattern >
          (?x)^(
              .*\/(\.venv)\/.*
          )$
    - id: end-of-file-fixer
      exclude: *exclude_pattern
    - id: check-yaml
      exclude: *exclude_pattern
    - id: check-toml
      exclude: *exclude_pattern

- repo: https://github.com/psf/black
  rev: 24.2.0
  hooks:
    - id: black
      language_version: python3
      args: ["--line-length=88", "--target-version=py310", "--quiet"]
      exclude: *exclude_pattern

- repo: https://github.com/pycqa/isort
  rev: 5.13.2
  hooks:
    - id: isort
      name: isort (python)
      args: ["--profile=black", "--line-length=88", "--quiet"]
      exclude: *exclude_pattern

- repo: https://github.com/pycqa/flake8
  rev: 7.0.0
  hooks:
    - id: flake8
      additional_dependencies: [flake8-docstrings]
      args:
        - "--max-line-length=88"  # Match Black and Ruff line length
        # Ignore style warnings to focus on functional issues
        - "--ignore=D,W,E226,E402,E501,W503"
        - "--per-file-ignores=__init__.py:F401,tests/*:F,E"
      exclude: *exclude_pattern

- repo: local
  hooks:
    - id: guidance-compliance
      name: guidance-compliance
      entry: python tools/check_compliance.py
      language: python
      additional_dependencies: [pyyaml]
      types: [text]
      exclude: ^(.git/|.venv/|venv/|env/|node_modules/|__pycache__/|.pytest_cache/|.ipynb_checkpoints/)
    - id: check-ontology-integrity
      name: Check ontology integrity
      entry: python tools/validate_ontology.py
      language: system
      types: [text]
      files: \.(ttl|turtle)$
      pass_filenames: true
    - id: check-absolute-paths
      name: Check for absolute paths
      entry: pytest tests/test_path_validation.py -v
      language: system
      types: [text]
      pass_filenames: false
    - id: check-ontology-paths
      name: Check ontology file paths
      entry: python -c "import re; import sys; exit(1 if any(re.search(r'^(?:file:///|/[A-Za-z](?:/|\\\\)|[A-Za-z]:\\\\)', line) for line in sys.stdin) else 0)"
      language: system
      types: [text]
      files: \.(ttl|turtle)$
      exclude: ^(.git/|.venv/|venv/|env/|node_modules/|__pycache__/|.pytest_cache/|.ipynb_checkpoints/)

default_language_version:
    python: python3

default_stages: [pre-commit]

ci:
    autofix_commit_msg: |
        [pre-commit.ci] Auto fixes from pre-commit hooks

        for more information, see https://pre-commit.ci
    autofix_prs: true
    autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
    autoupdate_schedule: weekly
    skip: []
    submodules: false
