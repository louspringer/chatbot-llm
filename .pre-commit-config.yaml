# Ontology: deploy:PreCommitComponent
# Implements: deploy:CommitValidation
# Requirement: REQ-DEP-002 Pre-commit validation
# Guidance: guidance:DeploymentPatterns#PreCommitHooks
# Description: Pre-commit hook configuration for validation

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.5.0
  hooks:
    - id: trailing-whitespace
      types: [text]
      exclude: '^.*\/(\.venv|assets|botbuilder-python)\/.*$'
    - id: end-of-file-fixer
      types: [text]
      exclude: '^.*\/(\.venv|assets|botbuilder-python)\/.*$'
    - id: check-yaml
      types: [yaml]
      exclude: '^.*\/(\.venv|assets|botbuilder-python)\/.*$'
    - id: check-toml
      types: [toml]
      exclude: '^.*\/(\.venv|assets|botbuilder-python)\/.*$'

- repo: https://github.com/psf/black
  rev: 24.2.0
  hooks:
    - id: black
      types: [python]
      exclude: '^.*\/\.venv\/.*$'
      args: ["--line-length=88", "--target-version=py310"]

- repo: https://github.com/pycqa/isort
  rev: 5.13.2
  hooks:
    - id: isort
      types: [python]
      exclude: '^.*\/\.venv\/.*$'
      args: ["--profile=black", "--line-length=88"]

- repo: https://github.com/pycqa/flake8
  rev: 7.0.0
  hooks:
    - id: flake8
      types: [python]
      exclude: '^.*\/\.venv\/.*$'
      args: ["--max-line-length=88", "--extend-ignore=E203"]

- repo: local
  hooks:
    - id: guidance-compliance
      name: Check guidance compliance
      entry: python tools/check_compliance.py
      language: python
      types: [python]
      exclude: '^.*\/\.venv\/.*$'
      pass_filenames: false

default_language_version:
    python: python3

default_stages: [pre-commit]

ci:
    autofix_commit_msg: |
        [pre-commit.ci] Auto fixes from pre-commit hooks

        for more information, see https://pre-commit.ci
    autofix_prs: true
    autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
    autoupdate_schedule: weekly
    skip: []
    submodules: false
